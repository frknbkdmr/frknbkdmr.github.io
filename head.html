<!-- IBM Plex is served from this origin, not fonts.gstatic.com: a remote font
     hands every visitor's IP to a third party on first paint, which is exactly
     the transfer EU courts have ruled on. Regenerate with fetch_fonts.py. -->
<link rel="preload" href="/fonts/IBMPlexSans-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">

<!-- Raster icon fallbacks. Quarto emits the SVG icon itself; Safari before 17
     and most link-preview crawlers ignore SVG favicons entirely. -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- RFC 8288 links, expressed as HTML elements. GitHub Pages serves static
     files and cannot set a Link: response header, but the spec treats both
     carriers as the same thing. Only relations with something real behind
     them: rel=author names the authoritative record for the person, rel=me
     asserts the profiles are the same identity. It is the HTML-level
     counterpart of sameAs below, which parsers that never read JSON-LD still
     consume. -->
<link rel="author" href="https://orcid.org/0000-0002-7236-5776">
<link rel="me" href="https://orcid.org/0000-0002-7236-5776">
<link rel="me" href="https://github.com/frknbkdmr">
<link rel="me" href="https://osf.io/m7kez/">
<link rel="me" href="https://www.researchgate.net/profile/Furkan-Bekdemir">
<!-- LinkedIn is here and not in the footer on purpose. It is the profile search
     engines already rank highest for this name, so claiming it merges that
     recognition into this site's entity. It is not a place research output
     lives, which is what the footer list is for. LinkedIn marks every outbound
     link nofollow, so the value is the identity claim, not the link. -->
<link rel="me" href="https://www.linkedin.com/in/furkanbekdemir">
