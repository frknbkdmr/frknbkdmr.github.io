project:
  type: website
  output-dir: _site
  post-render: python site-post-render.py
  # Pages are .qmd. Anything with a DOI gets its own page under research/ so
  # the address can be cited and never has to move. Naming only .qmd here stops
  # a stray .md dropped in the repo from being published.
  render:
    - "*.qmd"
    - "research/*.qmd"
    # tools.qmd stays at the root so /tools, which is already indexed and in
    # the sitemap, never has to move. Its children sit under tools/ and the two
    # coexist: /tools serves the index, /tools/gorungu serves the page.
    - "tools/*.qmd"
    # Development logs. The instrument pages are records, written so someone can
    # rebuild or audit the thing; a log is the reasoning and the wrong turns,
    # which would dilute a record if the two shared a page.
    - "log/*.qmd"
    # Same arrangement as tools: notlar.qmd stays at the root so /notlar does not
    # move, and its children sit under notlar/.
    - "notlar/*.qmd"
    # English versions of the notes, when they get written. Two addresses per
    # note rather than one bilingual page, because a page can only declare one
    # language and a crawler serving the wrong one to the wrong reader is worse
    # than two clean pages. Each side names the other with `translation:` in its
    # front matter and post-render.py turns that into hreflang. Slugs are in
    # their own language: /notlar/duyusal-azaltim and /notes/sensory-attenuation.
    - "notes/*.qmd"
  resources:
    # Without CNAME in this list, publishing drops the file and GitHub forgets
    # the custom domain on the next deploy.
    - CNAME               # furkanbekdemir.com; apex A records live since 2026-07-26
    - yandex_97bb922f930d7b26.html   # Yandex Webmaster ownership check
    # IndexNow key. Bing verifies ownership by fetching this file before it will
    # accept a submission, so if it stops being published the notifications
    # start failing silently.
    - bfe9b1f5d8eb425ea297b7c2447647b4.txt
    - og-image.png
    - favicon.ico
    - favicon-32.png
    - apple-touch-icon.png
    - fonts/

website:
  title: "Furkan Bekdemir"
  description: "Psychiatry resident and computational psychiatry researcher at Ondokuz Mayıs University. Belief updating, sensory attenuation, and instrumentation for psychiatric research."
  site-url: "https://furkanbekdemir.com"
  favicon: favicon.svg
  # Shown when the site is pasted into LinkedIn, WhatsApp and the like.
  # Regenerate with `python make-og-image.py`.
  image: "https://furkanbekdemir.com/og-image.png"
  open-graph: true
  twitter-card: true
  # Five static pages reachable from the navbar; the search bundle
  # (fuse + autocomplete) is weight without a job.
  search: false
  navbar:
    pinned: true
    left:
      - text: "Research"
        href: research/index.qmd
      - text: "Instruments &amp; code"
        href: tools.qmd
      # Both languages get a navbar entry rather than one hiding behind the
      # other. The Turkish notes are the originals and the English ones reach
      # further; burying either behind a link inside the other costs more than
      # a fifth item does.
      - text: "Notes"
        href: notes.qmd
      - text: "Notlar"
        href: notlar.qmd
      - text: "CV"
        href: cv.qmd
  page-footer:
    left: "Furkan Bekdemir, MD &middot; Department of Psychiatry, Ondokuz Mayıs University, Samsun"
    right:
      - text: "ORCID"
        href: "https://orcid.org/0000-0002-7236-5776"
      - text: "GitHub"
        href: "https://github.com/frknbkdmr"
      - text: "OSF"
        href: "https://osf.io/m7kez/"
      - text: "ResearchGate"
        href: "https://www.researchgate.net/profile/Furkan-Bekdemir"

format:
  html:
    theme: [cosmo, custom.scss]
    grid:
      body-width: 680px
      sidebar-width: 0px
      margin-width: 0px
    toc: false
    anchor-sections: false
    include-in-header: head.html
    link-external-newwindow: true
